{% extends "base.html" %}
{% block title %}Galeri — Kaçkar Peak{% endblock %}
{% block content %}
<section style="padding-top:140px">
  <div class="wrap">
    <div class="sec-head reveal"><div><div class="eyebrow" style="margin-bottom:14px">Anılar</div><h2>Galeri</h2></div></div>
    {% if images %}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px;background:var(--line);border:1px solid var(--line)" class="reveal">
      {% for img in images %}
      <figure style="margin:0;background:var(--granite);aspect-ratio:4/3;overflow:hidden;position:relative">
        <img src="{{ img.image.url }}" alt="{{ img.caption }}" style="width:100%;height:100%;object-fit:cover">
        {% if img.caption %}<figcaption style="position:absolute;bottom:0;left:0;right:0;padding:14px;font-size:13px;background:linear-gradient(transparent,rgba(23,26,28,.9));color:var(--snow)">{{ img.caption }}</figcaption>{% endif %}
      </figure>
      {% endfor %}
    </div>
    {% else %}
    <p style="color:var(--mist)">Henüz görsel eklenmedi. Yakında etkinlik fotoğraflarımız burada olacak.</p>
    {% endif %}
  </div>
</section>
{% endblock %}
