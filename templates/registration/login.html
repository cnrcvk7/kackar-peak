{% extends "base.html" %}
{% block title %}Giriş — Kaçkar Peak{% endblock %}
{% block content %}
<section style="padding-top:140px;min-height:70vh">
  <div class="wrap" style="max-width:440px">
    <div class="eyebrow" style="margin-bottom:14px">Tekrar hoş geldin</div>
    <h2 style="font-family:'Fraunces',serif;font-weight:500;font-size:40px;margin-bottom:32px">Giriş yap</h2>

    {% if form.errors %}
    <div class="form-error">Kullanıcı adı veya şifre hatalı. Tekrar dene.</div>
    {% endif %}

    <form method="post" class="auth-form">
      {% csrf_token %}
      <label>Kullanıcı adı
        {{ form.username }}
      </label>
      <label>Şifre
        {{ form.password }}
      </label>
      <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:8px">Giriş yap</button>
    </form>

    <p style="color:var(--mist);margin-top:24px;font-size:14px">
      Hesabın yok mu? <a href="{% url 'community:signup' %}" style="color:var(--lime)">Kayıt ol</a>
    </p>
  </div>
</section>
{% endblock %}
